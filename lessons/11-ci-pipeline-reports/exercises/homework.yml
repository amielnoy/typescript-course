# Lesson 11 – Homework: A Full QA Pipeline for the Course Repository
# Combines every topic of the lesson: triggers, inputs, concurrency, permissions, cache, matrix, needs,
# artifacts + if: always(), Playwright + Allure, GitHub Pages and a quality gate.
# Fill in every place marked TODO. Self-check: the checklist at the end of the file + compare with solutions/homework.yml
#
# Scenario:
#   You are the QA automation engineer of this course repository. The team wants ONE workflow that
#   gives fast feedback on every PR, runs a full regression every night, lets anyone run a chosen
#   Playwright suite by hand, publishes the latest Allure report to GitHub Pages, and exposes a
#   single check ("quality-gate") that Branch Protection can require.
#   This time the tasks say WHAT is needed – finding the exact keys and expressions is part of the work
#   (the topic exercises 03–07 and examples/workflows/ have everything you need).
#
# Tasks:
#  1. Triggers:
#       - pull_request to main – but only when code changed (lessons/, shared/, scripts/, package files,
#         tsconfig.json, the workflow files). A PR that touches only README files at the root must not start a run.
#       - push to main
#       - a nightly run on weekdays (pick the hour; remember cron is in UTC)
#       - a manual run with an input named suite – a choice of all / api / ui / smoke (default all)
#  2. Workflow-level settings:
#       - concurrency: one run per branch/PR, a new push cancels the old run
#       - least-privilege permissions: the code may only be read (any job that needs more asks for it itself)
#  3. A job named quality (fast feedback, Node 22): checkout → setup-node with npm cache → npm ci
#     → npm run typecheck → npm run solutions
#  4. A job named tests that runs only after quality passed, on Node 22 AND 24 (a matrix – one failing
#     version must not cancel the other). It runs npm run report and uploads reports/ as an artifact
#     whose name contains the Node version – also (and mainly) when the tests failed.
#  5. A job named playwright (after quality) that works inside lessons/11-ci-pipeline-reports/playwright-project:
#       - install the root dependencies too (the mock API needs tsx from the root)
#       - install the project dependencies (it has no package-lock.json – see how .github/workflows/ci.yml handles it)
#       - install chromium with its system dependencies
#       - run the suite chosen in the input (all → everything, api → --project=api,
#         ui → --project=chromium, smoke → --grep @smoke); on push/PR/schedule there is no input → all
#       - generate the Allure report and upload the evidence (playwright-report/, allure-report/, test-results/)
#         as one artifact – even when the tests failed
#  6. A job named deploy-report that publishes allure-report to GitHub Pages – ONLY on a push to main
#     or on the nightly run (never on a PR or a manual run), and also when the tests failed.
#     Give this job (and only this job) the extra permissions that Pages needs.
#     Hint: the Pages artifact is prepared in the playwright job, under the same condition.
#  7. (Challenge) A job named quality-gate that needs all four jobs and always runs. It writes a results
#     table (job | result) to $GITHUB_STEP_SUMMARY, and fails when any needed job failed or was cancelled.
#     Think: deploy-report is "skipped" on every PR – the gate must still pass there.
#  8. (Challenge) Make it production-grade:
#       - cancel-in-progress only for PRs (a main/nightly run that is deploying must never be cut in the middle)
#       - a separate concurrency group for the Pages deploy that never cancels
#       - timeout-minutes on every job
#       - skip the browser installation when the chosen suite is api
#       - show the chosen suite in the name of the playwright job

