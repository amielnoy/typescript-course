# Lesson 11 – Homework Solution: A Full QA Pipeline for the Course Repository
# Copy to .github/workflows/qa-pipeline.yml in your own repository.
# Before the first deploy: Settings → Pages → Source: "GitHub Actions".
name: QA Pipeline

on:
  pull_request:
    branches: [main]
    paths: # docs-only PRs do not trigger the pipeline
      - "lessons/**"
      - "shared/**"
      - "scripts/**"
      - package.json
      - package-lock.json
      - tsconfig.json
      - ".github/workflows/**"
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1-5" # nightly: 03:00 UTC, Monday to Friday
  workflow_dispatch:
    inputs:
      suite:
        description: "Which Playwright suite to run"
        type: choice
        options: [all, api, ui, smoke]
        default: all

# One run per branch/PR. On a PR a new push cancels the old run;
# on main (push / nightly) we let the run finish, so a report deploy is never cut in the middle.
concurrency:
  group: qa-pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: by default every job can only read the code.
# The single job that needs more (deploy-report) asks for it at the job level.
permissions:
  contents: read

jobs:
  # ---------- 1. Fast feedback: types + all the solutions ----------
  quality:
    name: Typecheck & solutions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run solutions

  # ---------- 2. API tests + HTML report on two Node versions ----------
  tests:
    name: Tests (Node ${{ matrix.node }})
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false # one red version must not hide the result of the other
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci

      - name: API tests with HTML report
        run: npm run report

      - name: Upload reports
        if: always() # the report matters most exactly when the tests failed
        uses: actions/upload-artifact@v7
        with:
          name: reports-node-${{ matrix.node }}
          path: reports/
          retention-days: 14

  # ---------- 3. Playwright (API + UI) + Allure ----------
  playwright:
    name: Playwright (${{ inputs.suite || 'all' }}) + Allure
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: lessons/11-ci-pipeline-reports/playwright-project
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies (tsx for the mock API)
        working-directory: .
        run: npm ci

      - name: Install Playwright project dependencies
        # this project has no package-lock.json of its own – fall back to npm install
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Install browsers
        if: ${{ inputs.suite != 'api' }} # the API suite needs no browser
        run: npx playwright install --with-deps chromium

      - name: Pick the suite
        id: suite
        env:
          SUITE: ${{ inputs.suite || 'all' }} # push / PR / schedule have no inputs → all
        run: |
          case "$SUITE" in
            api)   echo "args=--project=api" >> "$GITHUB_OUTPUT" ;;
            ui)    echo "args=--project=chromium" >> "$GITHUB_OUTPUT" ;;
            smoke) echo "args=--grep @smoke" >> "$GITHUB_OUTPUT" ;;
            *)     echo "args=" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Run Playwright tests
        run: npx playwright test ${{ steps.suite.outputs.args }}

      - name: Generate Allure report
        if: always()
        run: npx allure generate allure-results --clean -o allure-report

      - name: Upload evidence (HTML report, Allure, traces, screenshots, videos)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-evidence-${{ github.run_number }}
          path: |
            lessons/11-ci-pipeline-reports/playwright-project/playwright-report/
            lessons/11-ci-pipeline-reports/playwright-project/allure-report/
            lessons/11-ci-pipeline-reports/playwright-project/test-results/
          retention-days: 14

      - name: Prepare the Pages artifact (main / nightly only)
        if: ${{ always() && (github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: lessons/11-ci-pipeline-reports/playwright-project/allure-report

  # ---------- 4. Publish the Allure report to GitHub Pages ----------
  deploy-report:
    name: Deploy Allure report to Pages
    needs: playwright
    # publish even when tests failed (that is when the report is needed!) – but never on a PR or a manual run
    if: ${{ !cancelled() && (github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write # publish to Pages
      id-token: write # deploy-pages authenticates with an OIDC token
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # ---------- 5. One required check for Branch Protection ----------
  quality-gate:
    name: Quality gate
    needs: [quality, tests, playwright, deploy-report]
    if: always() # must run even when a needed job failed – a skipped gate looks "green"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write results table
        run: |
          {
            echo "## QA pipeline – results"
            echo ""
            echo "| Job | Result |"
            echo "|-----|--------|"
            echo "| quality | ${{ needs.quality.result }} |"
            echo "| tests (Node 22, 24) | ${{ needs.tests.result }} |"
            echo "| playwright | ${{ needs.playwright.result }} |"
            echo "| deploy-report | ${{ needs.deploy-report.result }} |"
            echo ""
            echo "Trigger: \`${{ github.event_name }}\` · suite: \`${{ inputs.suite || 'all' }}\` · run #${{ github.run_number }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if a needed job failed or was cancelled
        # "skipped" is fine (deploy-report is skipped on every PR)
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "At least one needed job failed or was cancelled – see the table in the run summary"
          exit 1
