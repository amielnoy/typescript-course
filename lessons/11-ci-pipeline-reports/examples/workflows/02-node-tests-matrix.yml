# שיעור 11 – Workflow 2: בדיקות Node/TypeScript על Pull Request עם Matrix ו-Artifacts
name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # לא לעצור את כל השילובים בגלל כישלון אחד
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    # => 4 jobs במקביל: ubuntu/22, ubuntu/24, windows/22, windows/24

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm # שומר בין ריצות את מטמון ההורדות של npm (‎~/.npm) – לא את node_modules (דורש package-lock.json)

      - run: npm ci

      - run: npm run typecheck

      - name: Run solutions
        run: npm run solutions

      - name: Build report
        run: npm run report

      - name: Upload report
        if: always() # גם אם השלב הקודם נכשל
        uses: actions/upload-artifact@v7
        with:
          name: report-${{ matrix.os }}-node${{ matrix.node }}
          path: reports/
